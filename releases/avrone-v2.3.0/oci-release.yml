name: Avrone v2.3 OCI supply-chain candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer release version
        required: true
        default: 2.3.0
      publish:
        description: Push the image and attestations to GHCR
        required: true
        type: boolean
        default: false

concurrency:
  group: avrone-oci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: doitupsolutions810-crow/avrone-sovereign-fabric

jobs:
  verify-build-sign:
    name: Verify, build, sign, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-supply-chain
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Test source and release verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q avrone
          python -m pytest -q
          python scripts/build_release.py --version "${{ inputs.release_version }}"
          python scripts/verify_release.py \
            --root . \
            --manifest RELEASE_MANIFEST.json \
            --zip "dist/avrone-sovereign-fabric-v${{ inputs.release_version }}.zip"

      - name: Generate SPDX SBOM
        run: python scripts/generate_sbom.py --root . --output dist/avrone.spdx.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@4907a6d50e7d700334c33e9f70e598b047e1e506 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-architecture immutable image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Require registry digest
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.build.outputs.digest }}'
          [[ '${{ steps.build.outputs.digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' '${{ steps.build.outputs.digest }}' > dist/image-reference.txt

      - name: Install Cosign
        if: inputs.publish
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Keyless-sign immutable image digest
        if: inputs.publish
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest SLSA provenance to registry
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SPDX SBOM to registry
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/avrone.spdx.json
          push-to-registry: true

      - name: Independently verify image subject
        if: inputs.publish
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/oci-release.yml@${{ github.ref }}
        run: |
          python scripts/verify_oci_subject.py \
            --image-ref "$IMAGE_REF" \
            --repository "$SOURCE_REPOSITORY" \
            --workflow-identity "$WORKFLOW_IDENTITY" \
            --provenance-output dist/provenance.json \
            --receipt-output dist/verification-receipt.json

      - name: Upload review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avrone-v2.3-supply-chain-evidence
          path: |
            dist/**
            RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
