apiVersion: v1
kind: Service
metadata:
  name: {{ include "control12.fullname" . }}-stable
spec:
  selector:
    app.kubernetes.io/name: {{ include "control12.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "control12.fullname" . }}-canary
spec:
  selector:
    app.kubernetes.io/name: {{ include "control12.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
