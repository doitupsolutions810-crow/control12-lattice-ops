# Named tunnel example — copy to config.yml (gitignored) or ~/.cloudflared/config.yml
#
# SECURITY:
#   - Never commit config.yml, *.json credentials, or cert.pem
#   - Store credentials under ~/.cloudflared/ with mode 600
#   - Prefer CONTROL12_CF_CONFIG=$HOME/.cloudflared/config.yml
#   - Run: npm run tunnel:check   (or bash scripts/check-tunnel-creds.sh)
#
# Setup:
#   1. cloudflared tunnel login          # writes ~/.cloudflared/cert.pem
#   2. cloudflared tunnel create control12-platform
#   3. cloudflared tunnel route dns control12-platform platform.example.com
#   4. chmod 600 ~/.cloudflared/*.json ~/.cloudflared/cert.pem
#   5. Copy this file and set tunnel UUID + credentials-file path OUTSIDE the repo
#   6. bash scripts/tunnel-named.sh
#
# Platform:
#   CONTROL12_PLATFORM_TOKEN=<secret>   # required for code/* ; recommended always
#   CONTROL12_CHAT_OPEN=1               # dev/tunnel only — do not use on a public hostname without token

tunnel: <TUNNEL_UUID>
credentials-file: /home/YOU/.cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: platform.example.com
    service: http://127.0.0.1:4400
    originRequest:
      connectTimeout: 10s
  - service: http_status:404
