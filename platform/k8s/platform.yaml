apiVersion: v1
kind: Namespace
metadata:
  name: control12
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control12-platform
  namespace: control12
data:
  CONTROL12_PLATFORM_HOST: "0.0.0.0"
  CONTROL12_PLATFORM_PORT: "4400"
  CONTROL12_LOCAL_AGENT_URL: "http://control12-local-agent:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control12-platform
  namespace: control12
spec:
  replicas: 2
  selector:
    matchLabels: { app: control12-platform }
  template:
    metadata:
      labels: { app: control12-platform }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: platform
          image: ghcr.io/doitupsolutions810-crow/control12-sovereign-platform@sha256:REPLACE_ME
          envFrom:
            - configMapRef: { name: control12-platform }
          ports:
            - { name: http, containerPort: 4400 }
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: state, mountPath: /state }
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: control12-platform
  namespace: control12
spec:
  selector: { app: control12-platform }
  ports:
    - { name: http, port: 4400, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control12-platform-default-deny
  namespace: control12
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
