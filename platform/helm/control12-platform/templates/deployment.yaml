apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .Release.Name }} }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: platform
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          env:
            - name: CONTROL12_PLATFORM_HOST
              value: "0.0.0.0"
            - name: CONTROL12_LOCAL_AGENT_URL
              value: {{ .Values.localAgentUrl | quote }}
          ports: [{ name: http, containerPort: 4400 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{ name: state, mountPath: /state }]
      volumes: [{ name: state, emptyDir: {} }]
