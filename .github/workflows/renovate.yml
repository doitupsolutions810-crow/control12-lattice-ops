name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: [self-hosted, macOS, ARM64, control12]
    timeout-minutes: 30

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = "arm64"
          sw_vers
          python3 --version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: CONTROL12 runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./scripts/preflight-runtime.sh ]]; then
            ./scripts/preflight-runtime.sh
          else
            echo "scripts/preflight-runtime.sh is not executable or not present" >&2
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve GitHub App bot identity
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')"
          printf 'author=%s[bot] <%s+%s[bot]@users.noreply.github.com>\n' \
            "$APP_SLUG" "$user_id" "$APP_SLUG" >> "$GITHUB_OUTPUT"

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: ${{ steps.app-identity.outputs.author }}
          RENOVATE_PLATFORM_COMMIT: "enabled"
          LOG_LEVEL: info
