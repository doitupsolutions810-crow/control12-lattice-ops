name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publishable: ${{ steps.package.outputs.publishable }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Detect publishable npm package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json && -f pnpm-lock.yaml ]]; then
            echo 'publishable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publishable=false' >> "$GITHUB_OUTPUT"
            echo 'No package.json and pnpm-lock.yaml pair found; npm publication skipped.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish to npm
    needs: preflight
    if: needs.preflight.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure recent npm with OIDC support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run --if-present build

      - name: Test
        run: pnpm run --if-present test

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public
