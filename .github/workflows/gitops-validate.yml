name: CONTROL12 GitOps Validate

on:
  pull_request:
    paths:
      - 'charts/control12/**'
      - 'gitops/**'
      - '.github/workflows/gitops-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, control12]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify required tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v helm
          command -v kubectl
          helm version --short
          kubectl version --client=true

      - name: Helm lint
        shell: bash
        run: |
          set -euo pipefail
          helm lint charts/control12 \
            --set region=validation \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set istio.host=control12.validation.example.com

      - name: Render chart
        shell: bash
        run: |
          set -euo pipefail
          helm template control12 charts/control12 \
            --namespace control12 \
            --set region=validation \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set istio.host=control12.validation.example.com \
            > /tmp/control12-rendered.yaml
          test -s /tmp/control12-rendered.yaml
          grep -q 'kind: Rollout' /tmp/control12-rendered.yaml
          grep -q 'kind: VirtualService' /tmp/control12-rendered.yaml

      - name: Verify immutable digest gate fails closed
        shell: bash
        run: |
          set -euo pipefail
          if helm template control12 charts/control12 \
            --namespace control12 \
            --set region=validation \
            --set image.digest=latest \
            --set istio.host=control12.validation.example.com \
            >/tmp/control12-invalid-render.yaml 2>/tmp/control12-invalid-render.err; then
            echo 'Mutable image reference unexpectedly passed Helm validation.' >&2
            exit 1
          fi
          grep -q 'image.digest must match sha256' /tmp/control12-invalid-render.err

      - name: Client-side Kubernetes validation where schemas are available
        shell: bash
        run: |
          set -euo pipefail
          if kubectl apply --dry-run=client -f gitops/argocd/control12-applicationset.yaml \
            >/tmp/control12-applicationset-validation.out \
            2>/tmp/control12-applicationset-validation.err; then
            exit 0
          fi
          if grep -q 'no matches for kind "ApplicationSet"' /tmp/control12-applicationset-validation.err; then
            echo 'ApplicationSet CRD schema is not installed in the runner kube context; YAML rendering checks still completed.'
            exit 0
          fi
          cat /tmp/control12-applicationset-validation.err >&2
          exit 1
