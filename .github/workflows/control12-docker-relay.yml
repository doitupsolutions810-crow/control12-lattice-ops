name: CONTROL12 Docker Relay Probe

on:
  pull_request:
    branches: [main]
    paths:
      - .control12-relay/trigger.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner allocation
        shell: bash
        run: |
          set -euo pipefail
          echo "CONTROL12_RELAY_RUNNER_OK"
          uname -a
