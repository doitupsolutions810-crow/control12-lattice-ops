name: CONTROL12 OCI Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-agent/**"
      - ".github/workflows/control12-image.yml"
  push:
    branches: [main]
    tags: ["local-agent-v*"]
    paths:
      - "local-agent/**"
      - ".github/workflows/control12-image.yml"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  artifact-metadata: write

concurrency:
  group: control12-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/control12-local-agent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./local-agent/package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create Buildx builder
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name control12-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build pull-request image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "CONTROL12_VERSION=${{ steps.version.outputs.value }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag control12-local-agent:test \
            --load local-agent
          docker run --rm --entrypoint node control12-local-agent:test --check /home/control12/.control12/app/server.mjs

      - name: Build and push multi-platform image
        id: publish
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          short_sha="${GITHUB_SHA::12}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "CONTROL12_VERSION=$version" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:sha-$short_sha" \
            --tag "$IMAGE:latest" \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --push local-agent
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" | awk '/^Digest:/ {print $2; exit}')"
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Generate registry-attached GitHub provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Independently verify provenance attestation
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_IMAGE: ${{ steps.publish.outputs.immutable }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMMUTABLE_IMAGE" --repo "$GITHUB_REPOSITORY"
          {
            echo "## CONTROL12 local-agent image verified"
            echo
            echo "- Immutable image: \`$IMMUTABLE_IMAGE\`"
            echo "- Provenance issuer: GitHub Actions OIDC"
            echo "- Verification: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
