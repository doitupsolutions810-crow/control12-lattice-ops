name: CONTROL12 Local Agent CI

# Automatic triggers are intentionally paused because this repository currently
# returns GitHub Actions `startup_failure` before creating any job. Re-enable
# pull_request/push triggers after the repository or account Actions restriction
# is cleared.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control12-local-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: local-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run source tests
        run: npm test
      - name: Check shell syntax
        run: bash -n scripts/install-macos.sh scripts/control12-app
