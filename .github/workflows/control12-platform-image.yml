name: CONTROL12 Sovereign Platform Image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/control12-platform-image.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/control12-platform-image.yml"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: control12-platform-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Create Buildx builder
        run: docker buildx create --use --driver docker-container && docker buildx inspect --bootstrap
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build validation image
        if: github.event_name == 'pull_request'
        run: docker buildx build --platform linux/amd64 --load -t control12-sovereign-platform:test platform
      - name: Publish multi-architecture image
        if: github.event_name != 'pull_request'
        env: { IMAGE: "ghcr.io/${{ github.repository_owner }}/control12-sovereign-platform" }
        run: |
          version="$(node -p "require('./platform/package.json').version")"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:sha-${GITHUB_SHA::12}" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --attest type=sbom \
            --attest type=provenance,mode=max \
            --push platform
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" | awk '/^Digest:/ {print $2; exit}')"
          echo "Immutable image: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
