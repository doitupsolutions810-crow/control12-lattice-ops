name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Repository preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Renovate JSON
        run: python3 -m json.tool renovate.json >/dev/null

      - name: Validate Python syntax
        run: |
          find . -path './.git' -prune -o -type f -name '*.py' -print0 \
            | xargs -0 -r python3 -m py_compile

      - name: Validate shell syntax
        run: |
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: Setup Node.js for procurement contract tests
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Test procurement evidence contract
        run: node --test procurement/test/evaluate.test.mjs evidence-console/test/contract.test.mjs

      - name: Detect npm workspace
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            [[ -f pnpm-lock.yaml ]] || {
              echo '::error::package.json exists but pnpm-lock.yaml is missing'
              exit 1
            }
            echo 'has_node=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_node=false' >> "$GITHUB_OUTPUT"
            echo 'No package.json found; Node matrix will be skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: preflight
    if: needs.preflight.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run --if-present lint

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        run: pnpm run --if-present build
